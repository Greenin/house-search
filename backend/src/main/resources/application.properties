spring.application.name=housesearch

server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5433/housesearch
spring.datasource.username=${POSTGRES_USER:oscar}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

anthropic.api-key=${ANTHROPIC_API_KEY}
anthropic.model=claude-opus-5
app.insert-api-key=${INSERT_API_KEY}

app.scraper.working-dir=../scraper
app.scraper.command=node index.js

app.cors.allowed-origin=http://localhost:4201
